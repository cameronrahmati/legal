<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuppStack Legal</title>
<meta name="robots" content="index, follow">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fbf9f8;
    color: #1b1c1b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .page { max-width: 720px; margin: 0 auto; padding: 32px 24px 64px; }
  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: 0 4px 16px rgba(27, 28, 27, 0.06);
  }
  nav { display: flex; gap: 16px; padding: 8px 0 24px; font-size: 15px; }
  nav a { color: #737784; text-decoration: none; }
  nav a[aria-current="page"] { color: #1b1c1b; }
  nav a:hover { color: #0657c0; }
  h1 { font-size: 32px; line-height: 1.25; letter-spacing: -0.02em; margin: 0 0 8px; }
  h2 { font-size: 22px; line-height: 1.3; letter-spacing: -0.01em; margin: 40px 0 12px; }
  h3 { font-size: 18px; margin: 28px 0 8px; }
  p { margin: 0 0 16px; }
  a { color: #0657c0; }
  ul { margin: 0 0 16px; padding-left: 22px; }
  li { margin-bottom: 6px; }
  code {
    background: #f5f3f2;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.9em;
  }
  .meta { color: #737784; font-size: 15px; margin-bottom: 32px; }
  .meta p { margin: 0 0 4px; }
  .table-scroll { overflow-x: auto; margin: 0 0 24px; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { text-align: left; padding: 12px 14px; vertical-align: top; }
  thead th { background: #f5f3f2; color: #424753; }
  tbody tr:nth-child(even) td { background: #f5f3f2; }
  th:first-child { border-top-left-radius: 10px; }
  th:last-child { border-top-right-radius: 10px; }
  footer { color: #737784; font-size: 14px; margin-top: 32px; text-align: center; }
  @media (max-width: 600px) {
    .page { padding: 16px 12px 48px; }
    .card { padding: 28px 20px; border-radius: 16px; }
    h1 { font-size: 27px; }
  }
</style>
</head>
<body>
  <div class="page">
    <main class="card">
      <h1>SuppStack</h1>
      <p>Legal documents for the SuppStack iOS app.</p>
      <ul>
        <li><a href="privacy/">Privacy Policy</a></li>
        <li><a href="terms/">Terms of Use</a></li>
      </ul>
      <p>Questions, or a request to delete your data:
        <a href="mailto:cameron@sentic.io">cameron@sentic.io</a></p>
    </main>
    <footer>Cameron Rahmati</footer>
  </div>
</body>
</html>
